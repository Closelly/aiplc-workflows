name: Proponer una mejora
description: Describe un problema y el resultado que buscas.
title: '[Idea] '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema o necesidad
      description: ¿Quién lo encuentra y en qué momento del recorrido?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Resultado esperado
      description: Incluye alternativas consideradas y cómo verificarías la mejora.
    validations:
      required: true
